<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tesla 授權完成</title></head>
<body style="font-family:sans-serif;padding:24px">
<h2>Tesla 授權完成 ✅</h2><p>請複製下面這串授權碼，貼到 Grok Bot 的加密輸入框（不要貼在聊天裡）：</p>
<textarea id="c" rows="4" style="width:100%;font-size:16px" readonly></textarea>

</body></html>
